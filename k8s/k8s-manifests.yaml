# 1. PersistentVolumeClaim: Persists SQLite WAL database & Parquet Data Lake across Pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ecommerce-sqlite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# 2. Backend Deployment: Runs 2 load-balanced replicas of FastAPI with Health Probes & Persistent Storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-backend
  template:
    metadata:
      labels:
        app: ecommerce-backend
    spec:
      containers:
        - name: backend
          image: ecommerce-analytics-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_DIR
              value: "/app/data"
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /hello
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /hello
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: ecommerce-sqlite-pvc
---
# 3. Backend Service: Exposes FastAPI internally at http://backend:8000 and externally on NodePort 30800
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: ecommerce-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30800
---
# 4. Frontend Deployment: Runs 2 replicas of Express.js BI Dashboard with Readiness Probe
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-frontend
  template:
    metadata:
      labels:
        app: ecommerce-frontend
    spec:
      containers:
        - name: frontend-web
          image: ecommerce-analytics-frontend-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://backend:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# 5. Frontend Service: Exposes Express.js Website on NodePort 30300
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend-service
spec:
  type: NodePort
  selector:
    app: ecommerce-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
# 6. Horizontal Pod Autoscaler (HPA): Auto-scales Backend Pods from 2 up to 5 under high CPU load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecommerce-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecommerce-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# 7. NetworkPolicy: Zero-trust firewall rule controlling traffic to Backend pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
spec:
  podSelector:
    matchLabels:
      app: ecommerce-backend
  ingress:
    - {}
---
# 8. Ingress with TLS: Routes HTTPS traffic to Frontend and Swagger/WebHooks to Backend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
spec:
  tls:
    - hosts:
        - analytics.local
      secretName: ecommerce-tls-secret
  rules:
    - host: analytics.local
      http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecommerce-frontend-service
                port:
                  number: 3000