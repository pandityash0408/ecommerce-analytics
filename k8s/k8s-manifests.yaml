# 1. Backend Deployment: Runs 2 load-balanced replicas of the FastAPI Kitchen container
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-backend
  template:
    metadata:
      labels:
        app: ecommerce-backend
    spec:
      containers:
        - name: backend
          image: ecommerce-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# 2. Backend Service: Exposes FastAPI internally at http://backend:8000 and externally on NodePort 30800
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: ecommerce-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30800
---
# 3. Frontend Deployment: Runs the Express.js Dark-Mode Website & API Gateway container
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-frontend
  template:
    metadata:
      labels:
        app: ecommerce-frontend
    spec:
      containers:
        - name: frontend-web
          image: ecommerce-frontend-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://backend:8000"
---
# 4. Frontend Service: Exposes the Express.js Website to any browser on NodePort 30300
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend-service
spec:
  type: NodePort
  selector:
    app: ecommerce-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
# 5. Horizontal Pod Autoscaler (HPA): Automatically scales Backend Pods from 2 up to 5 under high CPU load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecommerce-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecommerce-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# 6. NetworkPolicy: Zero-trust firewall rule allowing traffic to Backend pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
spec:
  podSelector:
    matchLabels:
      app: ecommerce-backend
  ingress:
    - {}
---
# 7. Ingress with TLS: Routes HTTPS domain traffic to the Express.js Frontend Service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
spec:
  tls:
    - hosts:
        - analytics.local
      secretName: ecommerce-tls-secret
  rules:
    - host: analytics.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecommerce-frontend-service
                port:
                  number: 3000