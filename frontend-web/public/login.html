<!-- Clean Enterprise Login Page using PBKDF2-HMAC-SHA256 + HttpOnly SameSite=Strict Signed Cookies -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — E-Commerce Customer Behavior Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white border border-slate-200 rounded-lg shadow-sm p-7 space-y-6">
    <div class="space-y-1">
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Enterprise BI Access</p>
      <h1 class="text-lg font-bold text-slate-900 tracking-tight">E-Commerce Analytics</h1>
      <p class="text-xs text-slate-500">Sign in with your authorized credentials to access the dashboard.</p>
    </div>

    <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded px-3 py-2 font-medium"></div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required placeholder="Enter username"
          class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded focus:outline-none focus:bg-white focus:border-slate-900" />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password"
          class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded focus:outline-none focus:bg-white focus:border-slate-900" />
      </div>

      <button id="submitBtn" type="submit"
        class="w-full py-2 px-4 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded transition cursor-pointer">
        Sign In
      </button>
    </form>

    <div class="relative flex items-center py-1">
   <div class="flex-grow border-t border-slate-200"></div>
   <span class="flex-shrink mx-3 text-[11px] uppercase tracking-wider text-slate-400 font-medium">or</span>
   <div class="flex-grow border-t border-slate-200"></div>
 </div>

 <a href="/auth/google"
   class="w-full py-2 px-4 bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 text-xs font-semibold rounded transition flex items-center justify-center space-x-2">
   <svg class="w-4 h-4" viewBox="0 0 24 24">
     <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
     <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
     <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
     <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
   </svg>
   <span>Continue with Google</span>
 </a>

    <div class="pt-3 border-t border-slate-100 text-[11px] text-slate-400 flex items-center justify-between">
      <span>PBKDF2-SHA256 &bull; HttpOnly Session</span>
      <span>TLS Protected</span>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById("errorBox");
      const btn = document.getElementById("submitBtn");
      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.innerText = "Verifying...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = "/";
        } else {
          errBox.innerText = data.detail || "Invalid username or password.";
          errBox.classList.remove("hidden");
        }
      } catch (err) {
        errBox.innerText = "Unable to reach authentication server.";
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerText = "Sign In";
      }
    }
  </script>
</body>
</html>
