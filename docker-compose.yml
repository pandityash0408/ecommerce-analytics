# Multi-Container Stack: FastAPI Backend + Express.js Dashboard + Nginx HTTPS Reverse Proxy
services:
  backend:
    build: ./backend
    container_name: ecommerce-backend
    ports:
      - "8000:8000"
    environment:
      - DB_DIR=/app/data
    volumes:
      - sqlite_data:/app/data
    restart: always

  frontend-web:
    build: ./frontend-web
    container_name: ecommerce-express-web
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

  nginx:
    build: ./nginx
    container_name: ecommerce-nginx-https
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend-web
      - backend
    restart: always

volumes:
  sqlite_data: