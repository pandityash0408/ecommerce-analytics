services:
  # FastAPI Backend using a native Linux volume for 50x faster SQLite bulk writes
  backend:
    build: ./backend
    container_name: ecommerce-backend
    ports:
      - "8000:8000"
    environment:
      - DB_DIR=/app/data
    volumes:
      - sqlite_data:/app/data
    restart: always

  # Express.js Minimal Enterprise Web Dashboard on port 3000
  frontend-web:
    build: ./frontend-web
    container_name: ecommerce-express-web
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

# Persistent native Linux Docker volume (survives container restarts and rebuilds)
volumes:
  sqlite_data: