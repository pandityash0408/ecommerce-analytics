$kind: http-request
name: "Auth #2: Basic Auth -> Issue JWT (/login-basic)"
url: "{{base_url}}/login-basic"
method: POST
auth:
  type: basic
  credentials:
    username: alice
    password: "{{auth_password_0zk2}}"
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.access_token) { pm.collectionVariables.set('jwt_token', jsonData.access_token); }
    language: text/javascript
order: 2000
