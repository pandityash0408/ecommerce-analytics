$kind: http-request
name: "Auth #6a: OAuth2 Client Credentials (/oauth/token)"
url: "{{base_url}}/oauth/token"
method: POST
body:
  type: urlencoded
  content:
    grant_type: client_credentials
    client_id: analytics-robot
    client_secret: robot-secret-999
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.access_token) { pm.collectionVariables.set('oauth_token', jsonData.access_token); }
    language: text/javascript
order: 6000
